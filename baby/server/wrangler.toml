# Alaga sync server. See README.md in this folder.
name = "babylog-sync"
main = "worker.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "babylog-sync"
database_id = "60056cef-7efd-4857-93a0-e1be1083774d"

# Shared photos, encrypted on the phones (photos.js). Parked: without this
# binding /v1/photo answers 503 and phones keep their photos. To turn it on:
# enable R2 on the account, `npx wrangler r2 bucket create alaga-photos`,
# uncomment these lines, deploy, and set PHOTO_SYNC = true in ../js/share.js.
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "alaga-photos"

# Reminders with the app closed: send what's due, every minute (push.js).
[triggers]
crons = ["* * * * *"]
