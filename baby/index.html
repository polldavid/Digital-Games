<!-- /pictos -->
  <button class="theme-toggle" data-theme-toggle aria-label="Toggle light or dark mode">🌙</button>

  <!-- ===================== WELCOME / FIRST RUN ===================== -->
  <section class="welcome" id="welcome" hidden>
    <div class="welcome__inner">
      <div class="welcome__art" aria-hidden="true">
        <svg class="ic c-feed" width="26" height="30"><use href="#i-bottle"/></svg><svg class="ic c-feed" width="26" height="30"><use href="#i-bottle"/></svg><svg class="ic c-feed" width="26" height="30"><use href="#i-bottle"/></svg><svg class="ic c-wet" width="26" height="30"><use href="#i-drop"/></svg><svg class="ic c-wet" width="26" height="30"><use href="#i-drop"/></svg><svg class="ic c-dirty" width="26" height="30"><use href="#i-poo"/></svg><svg class="ic c-sleep" width="26" height="30"><use href="#i-moon"/></svg><svg class="ic c-sleep" width="26" height="30"><use href="#i-moon"/></svg>
      </div>
      <h1 class="welcome__title">Baby <em>Log</em></h1>
      <p class="welcome__sub">Feeds, diapers and sleep — timed, tracked and gently reminded, with straight answers for 3&nbsp;a.m. questions.</p>

      <form class="card form" id="welcome-form" autocomplete="off">
        <h2 class="form__title">Who are we looking after?</h2>
        <label class="field">
          <span class="field__label">Baby’s name</span>
          <input class="input" name="name" required maxlength="30" placeholder="e.g. Ava" />
        </label>
        <label class="field">
          <span class="field__label">Date of birth</span>
          <input class="input" type="date" name="birth" required />
          <span class="field__hint">Feeding, sleep and diaper guidance is based on age.</span>
        </label>
        <fieldset class="field">
          <legend class="field__label">Feeding</legend>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="feeding" value="breast" checked /><span>Breast</span></label>
            <label><input type="radio" name="feeding" value="formula" /><span>Formula</span></label>
            <label><input type="radio" name="feeding" value="mixed" /><span>Both</span></label>
          </div>
        </fieldset>
        <fieldset class="field">
          <legend class="field__label">Units</legend>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="units" value="metric" checked /><span>ml · °C · kg</span></label>
            <label><input type="radio" name="units" value="imperial" /><span>oz · °F · lb</span></label>
          </div>
        </fieldset>
        <button class="btn btn--primary btn--block btn--lg" type="submit">Start tracking</button>
        <p class="fineprint">Everything stays on this device. No account, no ads, works offline.</p>
      </form>
      <button class="btn btn--link" type="button" data-action="import-open">Restore from a backup</button>
      <a class="link-back" href="../">← All games &amp; tools</a>
    </div>
  </section>

  <!-- ===================== APP ===================== -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <button class="babychip" data-action="baby-switch" aria-label="Baby profile" id="babychip"></button>
      <button class="iconbtn" data-action="go" data-view="settings" data-focus="reminders" aria-label="Reminders" id="bell"><svg class="ic" width="24" height="24" aria-hidden="true"><use href="#i-bell"/></svg><span class="iconbtn__badge" id="bell-badge" hidden></span></button>
    </header>

    <div class="banner banner--bad" id="save-warning" hidden role="alert"></div>
    <div class="banner" id="banner" hidden role="alert"></div>

    <main class="views">
      <section class="view" id="view-today" aria-label="Today"></section>
      <section class="view" id="view-log" aria-label="History" hidden></section>
      <section class="view" id="view-health" aria-label="Health" hidden></section>
      <section class="view" id="view-help" aria-label="Answers" hidden></section>
      <section class="view" id="view-settings" aria-label="Settings" hidden></section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab tab--active" data-action="go" data-view="today"><svg class="ic tab__icon" width="24" height="24" aria-hidden="true"><use href="#i-today"/></svg><span class="tab__label">Today</span></button>
      <button class="tab" data-action="go" data-view="log"><svg class="ic tab__icon" width="24" height="24" aria-hidden="true"><use href="#i-list"/></svg><span class="tab__label">History</span></button>
      <button class="tab" data-action="go" data-view="health"><svg class="ic tab__icon" width="24" height="24" aria-hidden="true"><use href="#i-cross"/></svg><span class="tab__label">Health</span></button>
      <button class="tab" data-action="go" data-view="help"><svg class="ic tab__icon" width="24" height="24" aria-hidden="true"><use href="#i-question"/></svg><span class="tab__label">Answers</span></button>
      <button class="tab" data-action="go" data-view="settings"><svg class="ic tab__icon" width="24" height="24" aria-hidden="true"><use href="#i-sliders"/></svg><span class="tab__label">Settings</span></button>
    </nav>
  </div>

  <!-- Bottom sheet for logging / editing / help topics -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet__scrim" data-action="sheet-close"></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet__grab" aria-hidden="true"></div>
      <div class="sheet__head">
        <h2 class="sheet__title" id="sheet-title"></h2>
        <button class="iconbtn" data-action="sheet-close" aria-label="Close"><svg class="ic" width="24" height="24" aria-hidden="true"><use href="#i-close"/></svg></button>
      </div>
      <div class="sheet__body" id="sheet-body"></div>
    </div>
  </div>

  <!-- Confirmation for anything destructive (styled, unlike window.confirm) -->
  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog" class="confirm__body">
      <h2 class="confirm__title" id="confirm-title"></h2>
      <p class="confirm__text" id="confirm-text"></p>
      <div class="btn-row">
        <button class="btn btn--lg" value="" id="confirm-cancel">Cancel</button>
        <button class="btn btn--lg btn--primary" value="ok" id="confirm-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tip" id="tip" role="tooltip" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden />

  <script src="../theme.js?v=13"></script>
  <script src="js/guide.js?v=13"></script>
  <script src="js/store.js?v=13"></script>
  <script src="js/sound.js?v=13"></script>
  <script src="js/rx.js?v=13"></script>
  <script src="js/files.js?v=13"></script>
  <script src="js/ui.js?v=13"></script>
  <script src="js/forms.js?v=13"></script>
  <script src="js/views.js?v=13"></script>
  <script src="js/help.js?v=13"></script>
  <script src="js/health.js?v=13"></script>
  <script src="js/native.js?v=13"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
